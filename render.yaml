services:
  - type: web
    name: aurea-resort
    runtime: static
    repo: https://github.com/tuskycompany-source/Aurea-Resort
    branch: main
    buildCommand: npm install --global pnpm@11.25.0 && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: out
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
